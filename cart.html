<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="سلة مشتريات رونق - راجع المنتجات قبل إتمام الطلب."
    />
    <title>السلة | رونق</title>
    <link rel="icon" href="assets/brand/logo-icon.svg" type="image/svg+xml" />
    <script src="assets/js/language-init.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/i18n.js" defer></script>
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/cart-store.js" defer></script>
    <script src="assets/js/site.js" defer></script>
    <script src="assets/js/cart-page.js" defer></script>
  </head>
  <body
    data-page="cart"
    data-title-template="السلة | {store}"
    data-description-template="سلة مشتريات {store} - راجع المنتجات قبل إتمام الطلب."
  >
    <div id="site-header"></div>

    <main>
      <section class="section">
        <div class="container">
          <h1 class="section-title">سلة المشتريات</h1>
          <p class="section-subtitle">
            راجع المنتجات، عدّل الكميات، ثم انتقل إلى صفحة الدفع الآمن لإكمال الطلب.
          </p>
          <p id="cartStatus" class="form-status"></p>

          <div class="checkout-layout">
            <section id="cartItems" class="payment-card"></section>
            <aside class="order-summary">
              <h2>ملخص السلة</h2>
              <div id="cartSummary"></div>
              <div class="admin-actions">
                <a id="cartCheckoutLink" class="btn btn-gold" href="checkout.html"
                  >الانتقال إلى الدفع</a
                >
                <button id="clearCartBtn" class="btn btn-outline" type="button">
                  إفراغ السلة
                </button>
              </div>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
