<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Secure checkout for Rawnaq with support for bank cards, Apple Pay, and mada."
    />
    <title>Secure Checkout | Rawnaq</title>
    <link rel="icon" href="../assets/brand/logo-icon.svg" type="image/svg+xml" />
    <script src="../assets/js/language-init.js"></script>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <script src="../assets/js/config.js" defer></script>
    <script src="../assets/js/i18n.js" defer></script>
    <script src="../assets/js/products-data.js" defer></script>
    <script src="../assets/js/store-state.js" defer></script>
    <script src="../assets/js/site.js" defer></script>
    <script src="../assets/js/checkout.js" defer></script>
  </head>
  <body
    data-page="checkout"
    data-title-template="Secure Checkout | {store}"
    data-description-template="Secure checkout for {store} with support for bank cards, Apple Pay, and mada."
  >
    <div id="site-header"></div>

    <main>
      <section class="section">
        <div class="container">
          <h1 class="section-title">Secure Checkout</h1>
          <p class="section-subtitle">
            The checkout flow is designed to increase trust and conversion, with support for
            bank cards, Apple Pay, and mada for Saudi and GCC customers.
          </p>
          <p id="secureInfo" class="muted"></p>
          <div id="paymentBadges" class="secure-strip"></div>

          <div class="checkout-layout">
            <section class="payment-card">
              <h2>Select payment method</h2>
              <div id="paymentMethods" class="payment-methods"></div>

              <form id="checkoutForm" class="form-grid">
                <label>
                  Full Name
                  <input class="input" type="text" name="fullName" required />
                </label>
                <label>
                  Email Address
                  <input class="input" type="email" name="email" required />
                </label>
                <label>
                  Phone Number
                  <input class="input" type="tel" name="phone" required />
                </label>

                <div id="cardFields" class="form-grid">
                  <label>
                    Card Number
                    <input
                      class="input"
                      type="text"
                      name="cardNumber"
                      inputmode="numeric"
                      autocomplete="cc-number"
                      required
                    />
                  </label>
                  <div class="dual-inputs">
                    <label>
                      Expiry Date (MM/YY)
                      <input
                        class="input"
                        type="text"
                        name="cardExpiry"
                        autocomplete="cc-exp"
                        required
                      />
                    </label>
                    <label>
                      CVV
                      <input
                        class="input"
                        type="text"
                        name="cardCvv"
                        inputmode="numeric"
                        autocomplete="cc-csc"
                        required
                      />
                    </label>
                  </div>
                </div>

                <button id="checkoutSubmit" class="btn btn-gold" type="submit">
                  Complete Secure Payment
                </button>
                <p id="checkoutStatus" class="form-status"></p>
              </form>
            </section>

            <aside class="order-summary" id="orderSummary">
              <h2>Order Summary</h2>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
