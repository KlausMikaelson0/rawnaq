<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Frequently asked questions for Rawnaq to reduce support load and improve trust."
    />
    <title>FAQ | Rawnaq</title>
    <link rel="icon" href="../assets/brand/logo-icon.svg" type="image/svg+xml" />
    <script src="../assets/js/language-init.js"></script>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <script src="../assets/js/config.js" defer></script>
    <script src="../assets/js/i18n.js" defer></script>
    <script src="../assets/js/api.js" defer></script>
    <script src="../assets/js/cart-store.js" defer></script>
    <script src="../assets/js/site.js" defer></script>
    <script src="../assets/js/faq.js" defer></script>
  </head>
  <body
    data-page="faq"
    data-title-template="FAQ | {store}"
    data-description-template="Frequently asked questions for {store} to reduce support load and improve trust."
  >
    <div id="site-header"></div>

    <main>
      <section class="section">
        <div class="container">
          <h1 class="section-title">Frequently Asked Questions</h1>
          <p class="section-subtitle">
            Clear answers to common questions about ordering, operation, and ownership transfer.
          </p>
          <p id="faqStatus" class="form-status"></p>
          <div id="faqPageList" class="faq-list"></div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
